name: Rutitas Nightly Verification

on:
  schedule:
    - cron: '15 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: NuGet audit and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Rutitas.Api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Audit NuGet packages
        run: dotnet restore Rutitas.Api.slnx -p:NuGetAudit=true -p:NuGetAuditLevel=high -warnaserror

      - name: Run automated tests
        run: dotnet test Rutitas.Api.slnx -c Release --no-restore
