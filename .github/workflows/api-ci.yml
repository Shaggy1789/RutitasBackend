name: Rutitas API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Rutitas.Api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore with NuGet audit
        run: dotnet restore Rutitas.Api.slnx -p:NuGetAudit=true

      - name: Build
        run: dotnet build Rutitas.Api.slnx -c Release --no-restore -warnaserror

      - name: Unit, integration, security, contract and architecture tests
        run: dotnet test Rutitas.Api.slnx -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rutitas-tests
          path: Rutitas.Api/TestResults
          if-no-files-found: warn
          retention-days: 14

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan C# source
        run: semgrep scan --config p/csharp --error --metrics=off Rutitas.Api
